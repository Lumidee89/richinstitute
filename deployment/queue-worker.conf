; Supervisor template: adapt paths/user to the chosen host.
[program:rich-global-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/rich-global/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/rich-global
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/rich-global/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=120
